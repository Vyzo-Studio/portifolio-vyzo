name: Publicar portfólio VYZO Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: vyzo-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar diretório estático
        run: |
          mkdir -p dist
          cp index.html privacidade.html termos.html app.js data.js styles.css robots.txt sitemap.xml dist/
          cp -R assets dist/assets
          touch dist/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
