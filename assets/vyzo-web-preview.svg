<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">VYZO Studio — Prévia gráfica de interface</title><desc id="desc">Representação editorial do site autoral VYZO Studio, não uma captura de tela.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12162a"/><stop offset="1" stop-color="#050812"/></linearGradient>
<linearGradient id="accent" x1="0" x2="1"><stop stop-color="#bd50f9"/><stop offset=".52" stop-color="#7548fa"/><stop offset="1" stop-color="#2582fa"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#6241ff" stop-opacity=".55"/><stop offset="1" stop-color="#6241ff" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1280" height="800" fill="#080b16"/>
